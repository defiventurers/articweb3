<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sannin Manual Hex Placement Tool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a1a2a;
    color: #cfe3f0;
    overflow: hidden;
    min-height: 100vh;
  }
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(5, 30, 48, .96);
    border-bottom: 1px solid #2a5a75;
    padding: 12px 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    z-index: 1000;
  }
  .toolbar h1 { font-size: 15px; font-weight: 700; color: #ffd27a; margin-right: 8px; }
  .toolbar button, .toolbar select {
    background: #1e5a7a;
    border: 1px solid #2a5a75;
    color: #cfe3f0;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #2a7aa8; }
  .toolbar button.primary { background: #e6a84a; color: #0a1a2a; font-weight: 700; border-color: #f0c86e; }
  .toolbar button.primary:hover { background: #ffd27a; }
  .toolbar button#exportBtn { background: #1a7a3a; border-color: #2ecc71; }
  .toolbar button.danger { background: #a83a1a; border-color: #ff6b35; }
  .toolbar button.danger:hover { background: #ff6b35; }
  .toolbar .label { font-size: 12px; color: #8bb8d0; }
  .toolbar .info { font-size: 11px; color: #6a92a8; margin-left: auto; }
  .toolbar .row { display: flex; gap: 8px; align-items: center; }

  .canvas-container {
    position: absolute;
    top: 48px;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    padding: 8px;
  }
  .canvas-container svg {
    max-width: 95vw;
    max-height: calc(100vh - 55px);
    border: 1px solid #2a5a75;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }

  .hex-outline {
    fill: none;
    stroke: rgba(255, 80, 80, .6);
    stroke-width: 1;
  }
  .hex-placed {
    fill: rgba(255, 226, 132, .15);
    stroke: #fff0ad;
    stroke-width: 2;
  }
  .hex-active {
    fill: rgba(255, 80, 80, .25);
    stroke: rgba(255, 80, 80, .8);
    stroke-width: 2;
    stroke-dasharray: 4 2;
  }
  .hex-label {
    font: 600 9px/1 'Segoe UI', system-ui, sans-serif;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #ffe680;
    pointer-events: none;
  }
  .hex-id-label {
    font: 500 8px/1 'Segoe UI', system-ui, sans-serif;
    text-anchor: middle;
    dominant-baseline: central;
    fill: #a0c4d8;
    pointer-events: none;
  }

  .controls-panel {
    position: fixed;
    top: 48px;
    right: 12px;
    bottom: 12px;
    width: 340px;
    max-width: calc(50vw - 12px);
    background: rgba(8, 32, 55, .92);
    border: 1px solid #2a5a75;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .controls-panel h2 {
    font-size: 13px;
    font-weight: 700;
    color: #ffd27a;
    margin: 0;
    padding: 10px 14px;
    border-bottom: 1px solid #2a5a75;
  }
  .controls-content {
    padding: 10px 14px;
    overflow-y: auto;
    flex: 1;
  }
  .control-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .control-row label { font-size: 11px; color: #8bb8d0; }
  .control-row input[type="number"] {
    width: 100%;
    background: #0b2f4a;
    color: #cfe3f0;
    border: 1px solid #2a5a75;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .control-row input:focus { outline: 2px solid #4fc3f7; }
  .hex-grid-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 10px;
  }
  .hex-btn {
    background: #0b2f4a;
    border: 1px solid #2a5a75;
    color: #cfe3f0;
    padding: 6px 4px;
    border-radius: 4px;
    font-size: 9px;
    cursor: pointer;
    text-align: center;
  }
  .hex-btn:hover { background: #1a5a7a; }
  .hex-btn.active { background: #e6a84a; color: #0a1a2a; font-weight: 700; }
  .hex-btn.placed { background: #1a7a3a; border-color: #2ecc71; }
  .coord-inputs { display: flex; gap: 4px; }
  .coord-inputs input { flex: 1; width: 40px; }

  #placementInfo {
    padding: 8px 14px;
    background: rgba(0, 0, 0, .2);
    border-top: 1px solid #2a5a75;
    font-size: 11px;
    color: #a0c4d8;
  }

  @media (max-width: 1200px) {
    .controls-panel { position: fixed; top: 48px; right: 0; bottom: 0; width: 280px; max-width: 80vw; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>Sannin Manual Hex Placement</h1>
    <div class="row">
      <button id="modeSelect">Mode: SELECT</button>
      <select id="modeSelectDropdown">
        <option value="select">Select (place hex)</option>
        <option value="place">Place Current Hex Here</option>
        <option value="pan">Pan Grid</option>
      </select>
    </div>
    <div class="row">
      <button id="snapBtn">Snap to Grid</button>
      <button id="resetBtn">Reset All Offsets</button>
      <button id="exportBtn">Export Positions</button>
    </div>
    <span class="info">Click on a hex cell to place it over the visible hexagon in the board image</span>
  </div>

  <div class="canvas-container">
    <svg id="board" width="1334" height="1179" viewBox="0 0 1334 1179">
      <image id="boardImg" x="0" y="0" width="1334" height="1179"
             href="/assets/games/sannin-shogi/board.webp"
             alt="Board background" />
      <g id="gridLayer"></g>
    </svg>
  </div>

  <div class="controls-panel">
    <h2>Hex Placement Controls</h2>
    <div class="controls-content">
      <div class="control-row">
        <label>Current Hex: <span id="currentHex">0,0</span></label>
        <label>Status: <span id="hexStatus">Not placed</span></label>
      </div>

      <div class="control-row">
        <label>Position Offset (relative to projected position)</label>
        <div class="coord-inputs">
          <input type="number" id="offsetX" value="0" step="1" placeholder="X offset">
          <input type="number" id="offsetY" value="0" step="1" placeholder="Y offset">
        </div>
      </div>

      <div class="control-row">
        <label>Global Grid Offset (center)</label>
        <div class="coord-inputs">
          <input type="number" id="gridOffsetX" value="667" step="1" placeholder="Center X">
          <input type="number" id="gridOffsetY" value="590" step="1" placeholder="Center Y">
        </div>
      </div>

      <div class="control-row">
        <label>Grid Scale</label>
        <input type="number" id="gridScale" value="1.32" step="0.01" min="0.1" max="5">
      </div>

      <div class="control-row">
        <label>Placed Hexes (click to select)</label>
        <div id="hexList" class="hex-grid-list"></div>
      </div>

      <div class="control-row">
        <label>Go to hex:</label>
        <div class="coord-inputs">
          <input type="number" id="gotoQ" value="0" step="1" placeholder="q" min="-6" max="6">
          <input type="number" id="gotoR" value="0" step="1" placeholder="r" min="-6" max="6">
          <button id="gotoBtn" style="margin-top:4px;">Go To</button>
        </div>
      </div>
    </div>
    <div id="placementInfo">
      <div>Click on the highlighted hex outline, then click "Place" to set its position.</div>
      <div>Red dashed hex = currently selected hex.</div>
      <div style="margin-top:4px;">Yellow hex = placed (manually positioned).</div>
    </div>
  </div>

<script>
const SIZE = 30;
const RADIUS = 6;

function cellKey(q, r) { return q + ',' + r; }

function hexDistance(a, b = { q: 0, r: 0 }) {
  const dq = a.q - b.q;
  const dr = a.r - b.r;
  return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr));
}

function projectPointyTop(cell, size) {
  const { q, r } = cell;
  const x = q + r / 2;
  return {
    x: x === 0 ? 0 : Math.sqrt(3) * size * x,
    y: r === 0 ? 0 : 1.5 * size * r
  };
}

function pointyTopCorners(cell, size) {
  const center = projectPointyTop(cell, size);
  const halfWidth = Math.sqrt(3) * size / 2;
  const halfHeight = size / 2;
  const corners = [
    [center.x, center.y - size],
    [center.x + halfWidth, center.y - halfHeight],
    [center.x + halfWidth, center.y + halfHeight],
    [center.x, center.y + size],
    [center.x - halfWidth, center.y + halfHeight],
    [center.x - halfWidth, center.y - halfHeight]
  ];
  return corners;
}

function rotateAxial(cell, steps) {
  let q = cell.q;
  let r = cell.r;
  const turns = ((steps % 6) + 6) % 6;
  for (let i = 0; i < turns; i++) {
    [q, r] = [-r, q + r];
  }
  return { q, r };
}

function buildCells(radius) {
  const cells = [];
  for (let r = -radius; r <= radius; r++) {
    const minQ = Math.max(-radius, -r - radius);
    const maxQ = Math.min(radius, -r + radius);
    for (let q = minQ; q <= maxQ; q++) {
      cells.push({ q, r, id: cellKey(q, r), ring: hexDistance({ q, r }) });
    }
  }
  return cells;
}

// Territory definitions (rotated from Midori green home territory)
const GREEN_HOME_RAW = [
  [3,0],[4,0],[5,0],[6,0],
  [3,1],[4,1],[5,1],[6,1],
  [3,2],[4,2],[5,2],[6,2],
  [3,3],[4,3],[5,3],[6,3],
  [2,3],[2,4],[2,5],[2,6]
];

const RED_HOME = GREEN_HOME_RAW.map(([q, r]) => {
  const rot = rotateAxial({ q, r }, 4); // +120°
  return [rot.q, rot.r];
});
const GREEN_HOME = GREEN_HOME_RAW;
const BLUE_HOME = GREEN_HOME_RAW.map(([q, r]) => {
  const rot = rotateAxial({ q, r }, 2); // -120°
  return [rot.q, rot.r];
});

function isGreenHome(q, r) {
  return GREEN_HOME.some(([dq, dr]) => q === dq && r === dr);
}
function isRedHome(q, r) {
  return RED_HOME.some(([dq, dr]) => q === dq && r === dr);
}
function isBlueHome(q, r) {
  return BLUE_HOME.some(([dq, dr]) => q === dq && r === dr);
}

// State
const HEX_CELLS = Object.freeze(buildCells(RADIUS));
const IMAGE_WIDTH = 1334;
const IMAGE_HEIGHT = 1179;

let state = {
  centerX: 667,
  centerY: 590,
  scale: 1.32,
  mode: 'select',
  selectedHex: { q: 0, r: 0 },
  placedHexes: {}, // cellId -> { x, y } custom offsets
  snapToGrid: false
};

// Load saved positions from localStorage
const saved = localStorage.getItem('sannin-hex-positions');
if (saved) {
  const parsed = JSON.parse(saved);
  state.centerX = parsed.centerX || 667;
  state.centerY = parsed.centerY || 590;
  state.scale = parsed.scale || 1.32;
  state.placedHexes = parsed.placedHexes || {};
}

function projectCell(cellId) {
  const [q, r] = cellId.split(',').map(Number);
  const projected = projectPointyTop({ q, r }, SIZE);
  const placed = state.placedHexes[cellId];

  // If this hex has been manually placed, use custom offset
  if (placed) {
    const baseX = state.centerX + projected.x * state.scale;
    const baseY = state.centerY + projected.y * state.scale;
    return {
      x: baseX + placed.x,
      y: baseY + placed.y,
      baseX,
      baseY,
      corners: pointyTopCorners({ q, r }, SIZE).map(p => [
        state.centerX + p[0] * state.scale,
        state.centerY + p[1] * state.scale
      ])
    };
  }

  // Otherwise use projected position
  const x = state.centerX + projected.x * state.scale;
  const y = state.centerY + projected.y * state.scale;
  const corners = pointyTopCorners({ q, r }, SIZE).map(p => [
    state.centerX + p[0] * state.scale,
    state.centerY + p[1] * state.scale
  ]);

  return {
    x, y, baseX: x, baseY: y,
    corners
  };
}

function getHexAtPoint(svgX, svgY) {
  // Check if any hex corners contain this point
  for (const cell of HEX_CELLS) {
    const proj = projectCell(cell.id);
    const corners = proj.corners;

    // Ray casting algorithm
    let inside = false;
    for (let i = 0, j = corners.length - 1; i < corners.length; j = i++) {
      const [xi, yi] = corners[i];
      const [xj, yj] = corners[j];
      const intersect = ((yi > svgY) !== (yj > svgY)) &&
                        (svgX < (xj - xi) * (svgY - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    if (inside) return cell;
  }
  return null;
}

function getDistanceToPoint(cx, cy, px, py) {
  return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
}

function render() {
  // Sync inputs with state
  state.centerX = parseFloat(document.getElementById('gridOffsetX').value) || 667;
  state.centerY = parseFloat(document.getElementById('gridOffsetY').value) || 590;
  state.scale = parseFloat(document.getElementById('gridScale').value) || 1.32;

  const grid = document.getElementById('gridLayer');
  grid.innerHTML = '';

  // Draw all hex outlines
  HEX_CELLS.forEach((cell) => {
    const proj = projectCell(cell.id);
    const points = proj.corners.map(p => p.join(',')).join(' ');
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', points);

    const isPlaced = state.placedHexes[cell.id] !== undefined;
    const isSelected = state.selectedHex.q === cell.q && state.selectedHex.r === cell.r;

    // Classification
    if (cell.q === 0 && cell.r === 0) {
      poly.setAttribute('class', 'hex-outline');
      poly.style.stroke = '#fff0ad';
      poly.style.strokeWidth = '2';
    } else if (isSelected) {
      poly.setAttribute('class', 'hex-active');
    } else if (isPlaced) {
      poly.setAttribute('class', 'hex-placed');
    } else {
      poly.setAttribute('class', 'hex-outline');
      if (isRedHome(cell.q, cell.r)) {
        poly.style.stroke = 'rgba(235, 95, 102, .5)';
      } else if (isGreenHome(cell.q, cell.r)) {
        poly.style.stroke = 'rgba(78, 190, 137, .5)';
      } else if (isBlueHome(cell.q, cell.r)) {
        poly.style.stroke = 'rgba(73, 151, 235, .5)';
      }
    }
    grid.appendChild(poly);

    // Hex label (ring number)
    if (cell.ring > 0) {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.textContent = cell.ring;
      label.setAttribute('x', proj.x);
      label.setAttribute('y', proj.y);
      label.className = 'hex-label';
      label.style.opacity = isPlaced ? '1' : '0.4';
      grid.appendChild(label);
    }
  });

  // Update current hex display
  document.getElementById('currentHex').textContent = `${state.selectedHex.q},${state.selectedHex.r}`;
  document.getElementById('hexStatus').textContent =
    state.placedHexes[`${state.selectedHex.q},${state.selectedHex.r}`] !== undefined ? 'Placed' : 'Not placed';

  // Update offset display for current hex
  const currentId = cellKey(state.selectedHex.q, state.selectedHex.r);
  const placed = state.placedHexes[currentId];
  const proj = projectCell(currentId);
  document.getElementById('offsetX').value = placed ? placed.x : 0;
  document.getElementById('offsetY').value = placed ? placed.y : 0;

  // Update hex list
  renderHexList();
}

function renderHexList() {
  const list = document.getElementById('hexList');
  list.innerHTML = '';

  // Show all cells, color-coded by placement status
  HEX_CELLS.forEach((cell) => {
    const btn = document.createElement('button');
    btn.className = 'hex-btn';
    btn.textContent = cell.id;
    btn.title = `Select ${cell.id}`;
    const isPlaced = state.placedHexes[cell.id] !== undefined;
    const isCurrent = state.selectedHex.q === cell.q && state.selectedHex.r === cell.r;

    if (isPlaced) btn.classList.add('placed');
    if (isCurrent) btn.classList.add('active');

    btn.addEventListener('click', () => {
      state.selectedHex = { q: cell.q, r: cell.r };
      render();
    });
    list.appendChild(btn);
  });
}

// Event handlers
document.getElementById('gridOffsetX').addEventListener('input', () => {
  state.centerX = parseFloat(document.getElementById('gridOffsetX').value) || 667;
  document.getElementById('gridOffsetY').dispatchEvent(new Event('input'));
});

document.getElementById('gridOffsetY').addEventListener('input', () => {
  state.centerY = parseFloat(document.getElementById('gridOffsetY').value) || 590;
  render();
});

document.getElementById('gridScale').addEventListener('input', () => {
  state.scale = parseFloat(document.getElementById('gridScale').value) || 1.32;
  render();
});

document.getElementById('offsetX').addEventListener('change', () => {
  const currentId = cellKey(state.selectedHex.q, state.selectedHex.r);
  const x = parseInt(document.getElementById('offsetX').value) || 0;
  state.placedHexes[currentId] = state.placedHexes[currentId] || { x: 0, y: 0 };
  state.placedHexes[currentId].x = x;
  render();
});

document.getElementById('offsetY').addEventListener('change', () => {
  const currentId = cellKey(state.selectedHex.q, state.selectedHex.r);
  const y = parseInt(document.getElementById('offsetY').value) || 0;
  state.placedHexes[currentId] = state.placedHexes[currentId] || { x: 0, y: 0 };
  state.placedHexes[currentId].y = y;
  render();
});

document.getElementById('modeSelectDropdown').addEventListener('change', (e) => {
  state.mode = e.target.value;
  document.getElementById('modeSelect').textContent = 'Mode: ' + state.mode.toUpperCase();
});

document.getElementById('snapBtn').addEventListener('click', () => {
  state.snapToGrid = !state.snapToGrid;
  document.getElementById('snapBtn').textContent = state.snapToGrid ? 'Snap: ON' : 'Snap: OFF';
  document.getElementById('snapBtn').style.background = state.snapToGrid ? '#1a7a3a' : '#1e5a7a';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.placedHexes = {};
  state.centerX = 667;
  state.centerY = 590;
  state.scale = 1.32;
  document.getElementById('gridOffsetX').value = 667;
  document.getElementById('gridOffsetY').value = 590;
  document.getElementById('gridScale').value = '1.32';
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const exportData = {
    centerX: state.centerX,
    centerY: state.centerY,
    scale: state.scale,
    placedHexes: state.placedHexes
  };

  // Generate the transform string
  const transform = `translate(${state.centerX} ${state.centerY}) scale(${state.scale})`;

  // Generate hex position map
  let hexPosCode = '';
  Object.entries(state.placedHexes).forEach(([id, pos]) => {
    hexPosCode += `  "${id}": { x: ${pos.x}, y: ${pos.y} },\n`;
  });

  const exportDiv = document.getElementById('placementInfo');
  exportDiv.innerHTML = `
    <div style="color:#4fc3f7; font-weight:700; margin-bottom:4px;">Export Results:</div>
    <code style="display:block; margin:2px 0; font-size:11px;">GRID_TRANSFORM = "translate(${state.centerX} ${state.centerY}) scale(${state.scale} ${state.scale})";</code>
    <div style="margin-top:6px; color:#ffd27a; font-size:11px;">Per-hex custom offsets:</div>
    <pre style="display:block; margin:4px 0; padding:6px; background:#000; border-radius:4px; font-size:10px; overflow:auto; max-height:150px; color:#a0e0ff;">${hexPosCode || '  // No custom hex offsets placed'}</pre>
    <button id="saveBtn" style="margin-top:6px; background:#1a7a3a;">Save to localStorage</button>
  `;

  document.getElementById('saveBtn').addEventListener('click', () => {
    localStorage.setItem('sannin-hex-positions', JSON.stringify(exportData));
    document.getElementById('saveBtn').textContent = 'Saved!';
    setTimeout(() => { document.getElementById('saveBtn').textContent = 'Save to localStorage'; }, 2000);
  });
});

// Click on board to place/select
const boardSvg = document.getElementById('board');
boardSvg.addEventListener('click', (e) => {
  if (state.mode === 'pan') return;

  const rect = boardSvg.getBoundingClientRect();
  const svgX = e.clientX - rect.left;
  const svgY = e.clientY - rect.top;

  // Scale to viewBox coordinates (since viewBox might be larger than the rendered SVG)
  const viewBoxScaleX = 1334 / rect.width;
  const viewBoxScaleY = 1179 / rect.height;
  const vbX = svgX * viewBoxScaleX;
  const vbY = svgY * viewBoxScaleY;

  const clickedHex = getHexAtPoint(vbX, vbY);
  if (!clickedHex) return;

  state.selectedHex = { q: clickedHex.q, r: clickedHex.r };

  if (state.mode === 'place') {
    const proj = projectCell(clickedHex.id);
    // When placing, record offset from projected position
    const currentId = cellKey(clickedHex.q, clickedHex.r);
    state.placedHexes[currentId] = {
      x: vbX - proj.baseX,
      y: vbY - proj.baseY
    };
    render();
  } else {
    render();
  }
});

document.getElementById('gotoBtn').addEventListener('click', () => {
  const q = parseInt(document.getElementById('gotoQ').value) || 0;
  const r = parseInt(document.getElementById('gotoR').value) || 0;
  // Validate
  if (q >= -6 && q <= 6 && r >= -6 && r <= 6 && hexDistance({ q, r }) <= 6) {
    state.selectedHex = { q, r };
    render();
  }
});

// Touch support
boardSvg.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const event = new MouseEvent('click', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  boardSvg.dispatchEvent(event);
});

// File upload fallback
document.getElementById('boardImage').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  document.getElementById('boardImg').setAttribute('href', url);
});
render();
</script>
</body>
</html>
