name: Heritage Games Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/nine-ice-forts-server.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/nine-ice-forts-server.yml

jobs:
  authoritative-room-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run heritage game server tests
        id: heritage-tests
        continue-on-error: true
        run: npm run test:games > heritage-test-output.log 2>&1
      - name: Upload heritage test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heritage-test-diagnostics
          path: server/heritage-test-output.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Report heritage test result
        if: always()
        run: |
          cat heritage-test-output.log
          test "${{ steps.heritage-tests.outcome }}" = "success"
