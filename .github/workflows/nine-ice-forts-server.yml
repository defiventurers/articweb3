name: Heritage Games Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/nine-ice-forts-server.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/nine-ice-forts-server.yml

jobs:
  authoritative-room-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run heritage game server tests
        run: npm run test:games
