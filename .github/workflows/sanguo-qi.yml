name: Sanguo Qi
on:
  pull_request:
    paths:
      - frontend/src/games/heritage-arcade/**
      - frontend/scripts/build-sanguo-engine.mjs
      - frontend/package*.json
      - frontend/vitest.sanguo.config.ts
      - server/**
      - .github/workflows/sanguo-qi.yml
  push:
    branches: [main]
    paths:
      - frontend/src/games/heritage-arcade/**
      - frontend/scripts/build-sanguo-engine.mjs
      - frontend/package*.json
      - server/**
      - .github/workflows/sanguo-qi.yml
jobs:
  gameplay-and-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:sanguo
        working-directory: frontend
      - run: npm run check:sanguo-engine
        working-directory: frontend
      - run: npm run build:mainnet
        working-directory: frontend
      - run: npm install
        working-directory: server
      - run: npm run test:sanguo
        working-directory: server
