name: Phase 1 Config Checks

on:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Check frontend testnet env
        run: npm run check:testnet
      - name: Build frontend testnet
        run: npm run build:testnet
      - name: Check frontend mainnet env
        run: npm run check:mainnet
      - name: Build frontend mainnet
        run: npm run build:mainnet

  server:
    name: Server config checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Check server testnet env
        run: npm run check:testnet
      - name: Check server mainnet env
        run: npm run check:mainnet
