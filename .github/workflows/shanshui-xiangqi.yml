name: Shanshui Xiangqi
on:
  pull_request:
    paths:
      - 'frontend/src/games/shanshui-xiangqi/**'
      - 'frontend/scripts/build-shanshui*'
      - 'server/arcticPlay*'
      - 'server/shanshui*'
      - 'server/tests/shanshui*'
      - 'mobile/arctic-play/src/**'
      - '.github/workflows/shanshui-xiangqi.yml'
  workflow_dispatch:
jobs:
  rules-and-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
        working-directory: frontend
      - run: npm ci --ignore-scripts --no-audit
        working-directory: server
      - run: npm run test:shanshui && npm run check:shanshui-engine
        working-directory: frontend
      - run: npx vitest run --config vitest.shanshui.config.ts && npm run test:xiangqi
        working-directory: frontend
      - run: node --test tests/shanshui-online.test.js tests/arctic-play-online.test.js tests/arctic-play-socket.test.js tests/company-account-play.test.js tests/access-progression.test.js
        working-directory: server
