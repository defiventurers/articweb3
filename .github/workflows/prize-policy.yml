name: Prize Policy Evidence Test

on:
  push:
    branches: [main]
    paths:
      - "server/tests/prize-policy.test.js"
      - "server/loadPrizeBackend.js"
      - "server/index.js"
      - ".github/workflows/prize-policy.yml"
  pull_request:
    paths:
      - "server/tests/prize-policy.test.js"
      - "server/loadPrizeBackend.js"
      - "server/index.js"
      - ".github/workflows/prize-policy.yml"
  workflow_dispatch:

jobs:
  prize-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run prize policy evidence test
        run: node server/tests/prize-policy.test.js
