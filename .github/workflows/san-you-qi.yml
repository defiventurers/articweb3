name: San You Qi
on:
  pull_request:
    paths:
      - frontend/src/games/san-you-qi/**
      - frontend/scripts/build-sanyou-engine.mjs
      - frontend/tests/san-you-qi-smoke.spec.js
      - frontend/package*.json
      - frontend/vitest.sanyou.config.ts
      - server/sanyou*.js
      - server/sanyouEngine.cjs
      - server/tests/sanyou-online.test.js
      - server/package*.json
      - .github/workflows/san-you-qi.yml
  push:
    branches: [main]
    paths:
      - frontend/src/games/san-you-qi/**
      - frontend/scripts/build-sanyou-engine.mjs
      - frontend/tests/san-you-qi-smoke.spec.js
      - frontend/package*.json
      - frontend/vitest.sanyou.config.ts
      - server/sanyou*.js
      - server/sanyouEngine.cjs
      - server/tests/sanyou-online.test.js
      - server/package*.json
      - .github/workflows/san-you-qi.yml

jobs:
  gameplay-and-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:sanyou
        working-directory: frontend
      - run: npm run check:sanyou-engine
        working-directory: frontend
      - run: npm run build:mainnet
        working-directory: frontend
      - run: npm install
        working-directory: server
      - run: npm run test:sanyou
        working-directory: server
