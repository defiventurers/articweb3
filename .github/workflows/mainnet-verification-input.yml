name: Generate Mainnet Verification Input

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Build Standard JSON verification input
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract dependencies
        working-directory: contracts
        run: npm install

      - name: Compile for Abstract mainnet
        working-directory: contracts
        run: npm run compile:mainnet

      - name: Extract exact Standard JSON input
        working-directory: contracts
        shell: bash
        env:
          VAULT_ADDRESS: "0x61a13b26096c6c696603ba96951faee3828a33ce"
          DEPLOY_TX: "0x819a2b0d9f7d8bce05aaca6177a7b54f3cd0e13e6c50ce1c89274a4d157b5f19"
          GAME_SERVER: "0x4725FE6E9fC3b261d7D273586F6B05b529C42dcE"
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const buildInfoDir = path.resolve("artifacts-zk/build-info");
          const outputDir = path.resolve("../ops/evidence/mainnet-verification");
          const files = fs.readdirSync(buildInfoDir).filter((name) => name.endsWith(".json"));

          let selected;
          let sourceName;

          for (const file of files) {
            const buildInfo = JSON.parse(fs.readFileSync(path.join(buildInfoDir, file), "utf8"));
            const match = Object.keys(buildInfo.input?.sources || {}).find((name) =>
              name.endsWith("/EthGameEscrow.sol") || name === "EthGameEscrow.sol"
            );
            if (match) {
              selected = buildInfo;
              sourceName = match;
              break;
            }
          }

          if (!selected || !sourceName) {
            throw new Error("EthGameEscrow compiler input was not found in artifacts-zk/build-info");
          }

          const input = selected.input;
          const source = input.sources[sourceName]?.content || "";
          if (!source.includes("contract EthGameEscrow")) {
            throw new Error("Selected compiler input does not contain EthGameEscrow source");
          }

          fs.mkdirSync(outputDir, { recursive: true });
          fs.writeFileSync(
            path.join(outputDir, "standard-json-input.json"),
            JSON.stringify(input, null, 2) + "\n"
          );

          const details = {
            contractAddress: process.env.VAULT_ADDRESS,
            deployTransaction: process.env.DEPLOY_TX,
            contractName: "EthGameEscrow",
            sourceName,
            fullyQualifiedName: sourceName + ":EthGameEscrow",
            compilerVersion: selected.solcLongVersion || selected.solcVersion || "0.8.24",
            zkSolcVersion: "1.5.15",
            optimizerEnabled: Boolean(input.settings?.optimizer?.enabled),
            optimizerRuns: input.settings?.optimizer?.runs ?? null,
            constructorArgumentsAbiEncoded:
              "000000000000000000000000" + process.env.GAME_SERVER.slice(2).toLowerCase()
          };

          fs.writeFileSync(
            path.join(outputDir, "verification-details.json"),
            JSON.stringify(details, null, 2) + "\n"
          );

          console.log(JSON.stringify(details, null, 2));
          NODE

      - name: Upload verification packet
        uses: actions/upload-artifact@v4
        with:
          name: eth-vault-standard-json-1.5.15
          path: ops/evidence/mainnet-verification
          if-no-files-found: error
          retention-days: 30
