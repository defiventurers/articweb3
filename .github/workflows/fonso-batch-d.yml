name: FONSO retained APK and free multiplayer acceptance
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'mobile/arctic-play/src/storybook*'
      - 'mobile/arctic-play/build-deps/**'
      - 'mobile/arctic-play/scripts/apk_layout.py'
      - 'scripts/security-scan.mjs'
      - 'mobile/arctic-play/scripts/verify-retained-apks.py'
      - 'mobile/arctic-play/scripts/*storybook*'
      - 'mobile/arctic-play/tests/**'
      - 'frontend/public/early/downloads/**'
      - '.github/workflows/fonso-batch-d.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'mobile/arctic-play/src/storybook*'
      - 'mobile/arctic-play/build-deps/**'
      - 'mobile/arctic-play/scripts/apk_layout.py'
      - 'scripts/security-scan.mjs'
      - 'mobile/arctic-play/scripts/verify-retained-apks.py'
      - 'mobile/arctic-play/scripts/*storybook*'
      - 'mobile/arctic-play/tests/**'
      - 'frontend/public/early/downloads/**'
      - '.github/workflows/fonso-batch-d.yml'
permissions:
  contents: read
jobs:
  free-multiplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '24.22.3']
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: fixture
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: ''
      FONSO_MULTIPLAYER_TEST_DATABASE_URL: postgresql://fixture@127.0.0.1:5432/postgres
      AK_PASSPORT_RUNTIME_ENABLED: 'false'
      AK_VISA_DELIVERY_ENABLED: 'false'
      HIGH_STAKES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked server and rules dependencies
        run: |
          npm ci --prefix server --ignore-scripts --no-audit --no-fund
          npm ci --prefix shared/fair-play --ignore-scripts --no-audit --no-fund
      - name: Complete free matches and verify socket identity, replay and recovery
        run: >-
          node --test server/tests/free-multiplayer-socket.test.js
          server/tests/arctic-play-socket-recovery.test.js
          server/tests/two-stones-online.test.js
          server/tests/room-store-ordering.test.js
      - name: Preserve published game authority and scan credential literals
        run: |
          node shared/fair-play/check-rules-integrity.mjs
          node scripts/security-scan.mjs
  retained-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Reject damaged or unexpected APK fixtures without signing
        run: |
          python3 -m unittest discover -s mobile/arctic-play/tests -p 'test_retained_apks.py'
          python3 -m unittest discover -s mobile/arctic-play/tests -p 'test_apk_layout.py'
          python3 -m unittest discover -s mobile/arctic-play/tests -p 'test_storybook_accessibility_review.py'
      - name: Install locked retained-runtime test dependencies
        run: npm ci --prefix mobile/arctic-play/build-deps --ignore-scripts --no-audit --no-fund
      - name: Extract SHA-pinned public baseline and reproduce guarded presentation patch
        run: python3 mobile/arctic-play/scripts/prepare-storybook-review.py
      - name: Verify exact retained baseline and guarded candidate behavior
        run: |
          node mobile/arctic-play/tests/retained-apk-acceptance.mjs storybook-review/before
          node mobile/arctic-play/tests/storybook-runtime.mjs storybook-review/after/app.js
      - name: Install the existing browser-review test dependencies
        run: npm install --prefix "$RUNNER_TEMP/browser-review" --ignore-scripts --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
      - name: Locate or install the browser for rendered checks
        run: command -v google-chrome || "$RUNNER_TEMP/browser-review/node_modules/.bin/playwright" install chromium
      - name: Render baseline and guarded candidate with external networking blocked
        run: CHROME_BIN="$(command -v google-chrome || true)" PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/browser-review/package.json" node mobile/arctic-play/tests/storybook-browser.mjs
      - name: Reproduce original review contrast and enlarged-text failures
        env:
          STORYBOOK_STRICT_ACCESSIBILITY: '1'
          STORYBOOK_EVIDENCE_ROOT: storybook-review/accessibility-regression
        run: |
          set +e
          CHROME_BIN="$(command -v google-chrome || true)" PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/browser-review/package.json" node mobile/arctic-play/tests/storybook-browser.mjs
          regression_exit=$?
          set -e
          python3 - "$regression_exit" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('storybook-review/accessibility-regression/results.json').read_text())
          assert int(sys.argv[1]) != 0, 'Original review unexpectedly passed the stricter regressions'
          assert report['strictAccessibility'] is True
          assert report['errors'] == [], 'Failure must not be a page error'
          categories = {issue['category'] for issue in report['strictIssues']}
          assert 'low-control-contrast' in categories, categories
          assert any(issue['category'] in {'large-text-overlap', 'large-text-containment'}
                     and issue.get('target', '').startswith('.sb-crown')
                     for issue in report['strictIssues']), 'Original Crown overflow was not reproduced'
          home = [check for check in report['checks'] if 'homePreserved' in check]
          assert len(home) == 6 and all(check['homePreserved'] for check in home)
          print('Reproduced original review contrast and large-text defects; Home preserved.')
          PY
      - name: Stage separate CSS-only correction without modifying original artifacts
        run: |
          python3 mobile/arctic-play/scripts/prepare-storybook-accessibility-review.py --source storybook-review --output storybook-accessibility-review
          node mobile/arctic-play/tests/storybook-runtime.mjs storybook-accessibility-review/after/app.js
      - name: Verify corrected contrast and layout with original Home thresholds
        env:
          STORYBOOK_REVIEW_ROOT: storybook-accessibility-review
          STORYBOOK_EVIDENCE_ROOT: storybook-accessibility-review/evidence
          STORYBOOK_STRICT_ACCESSIBILITY: '1'
        run: CHROME_BIN="$(command -v google-chrome || true)" PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/browser-review/package.json" node mobile/arctic-play/tests/storybook-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-d-guarded-rendered-evidence
          path: storybook-review/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-d-presentation-correction-evidence
          path: |
            storybook-review/accessibility-regression
            storybook-accessibility-review/evidence
            storybook-accessibility-review/*.json
