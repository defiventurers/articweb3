name: Launch And Runtime Evidence Test

on:
  push:
    paths:
      - "server/launchMode.js"
      - "server/loadPrizeBackend.js"
      - "server/runtimeStatus.js"
      - "server/runtimeStatusBootstrap.js"
      - "server/liveMainnetSmoke.js"
      - "server/scripts/start-with-runtime-status.js"
      - "server/scripts/live-mainnet-smoke.js"
      - "server/tests/launch-mode.test.js"
      - "server/tests/runtime-status.test.js"
      - "server/tests/live-mainnet-smoke.test.js"
      - "ops/smoke/live-mainnet-smoke-checklist.md"
      - ".github/workflows/launch-mode.yml"
      - ".github/workflows/live-mainnet-smoke.yml"
  pull_request:
    paths:
      - "server/launchMode.js"
      - "server/loadPrizeBackend.js"
      - "server/runtimeStatus.js"
      - "server/runtimeStatusBootstrap.js"
      - "server/liveMainnetSmoke.js"
      - "server/scripts/start-with-runtime-status.js"
      - "server/scripts/live-mainnet-smoke.js"
      - "server/tests/launch-mode.test.js"
      - "server/tests/runtime-status.test.js"
      - "server/tests/live-mainnet-smoke.test.js"
      - "ops/smoke/live-mainnet-smoke-checklist.md"
      - ".github/workflows/launch-mode.yml"
      - ".github/workflows/live-mainnet-smoke.yml"
  workflow_dispatch:

jobs:
  launch-and-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run launch mode evidence test
        run: node server/tests/launch-mode.test.js

      - name: Run runtime status evidence test
        run: node server/tests/runtime-status.test.js

      - name: Run live mainnet smoke evidence test
        run: node server/tests/live-mainnet-smoke.test.js
