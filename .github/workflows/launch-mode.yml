name: Launch Mode Evidence Test

on:
  push:
    paths:
      - "server/launchMode.js"
      - "server/loadPrizeBackend.js"
      - "server/tests/launch-mode.test.js"
      - ".github/workflows/launch-mode.yml"
  pull_request:
    paths:
      - "server/launchMode.js"
      - "server/loadPrizeBackend.js"
      - "server/tests/launch-mode.test.js"
      - ".github/workflows/launch-mode.yml"
  workflow_dispatch:

jobs:
  launch-mode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run launch mode evidence test
        run: node server/tests/launch-mode.test.js
